name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue: every required check runs on the queue's merge commit,
  # heavy tier included.
  merge_group:
  # Nightly, heavy tier, on main; nightly.yml starts the same full run on the
  # other long-lived branches.
  schedule:
    - cron: "23 2 * * *"
  # Called by ci-label.yml when full-ci or signer-boundary-growth is added
  # to a pull request: the checks run again with the label in the event.
  # Its checks are named "label / <job>", so they never stand in for, or
  # hide, the required checks of the pull request's own run.
  workflow_call:
    inputs:
      tier:
        description: "unused (the pull request's labels decide)"
        type: string
        default: fast
  workflow_dispatch:
    inputs:
      tier:
        description: "fast: what every pull request runs; full: the heavy tier too"
        type: choice
        options: [full, fast]
        default: full

# The token GitHub gives each job can only read the repository. No job here
# needs more; a job that does must ask for it itself.
permissions:
  contents: read

# A newer push to the same pull request cancels the run it makes stale. A
# merge queue run has a ref of its own (gh-readonly-queue/...) and is never
# cancelled here. The event is part of the group, so a nightly or dispatched
# run never waits behind, or replaces, a push's run of the same branch; and a
# label's run (ci-label.yml) never cancels the pull request's own run, nor
# the run of another label (the label's name is in its group).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ github.event.action == 'labeled' && format('label-{0}', github.event.label.name) || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every third-party action is pinned to a full commit SHA; the comment names
# the release. Update both together. What each job guards: docs/notes/ci.md.
jobs:
  build-off-shard:
    name: build (OFF, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
          - shard: serial
    env:
      SANITIZE: "OFF"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, configure and build (gcc, Release, GZ_SANITIZE=OFF, GZ_INTEROP_PY)
        # .github/actions/gz-build/configs.sh: gcc-off. One shard saves the
        # compiler cache.
        uses: ./.github/actions/gz-build
        with:
          config: gcc-off
          save-cache: ${{ matrix.shard == '1' }}
      - name: Test
        # Reference tree; core (action list, runner, node, isolation check and
        # its negative test); simulator (generator, harness, known trace,
        # 1,000 seeds, nine extreme fault profiles); and, in the build without
        # sanitizers, the same tests again under valgrind. The wallet
        # break-checks (label slow) run in wallet-break-checks.yml.
        # Sharded by tools/ctest-shard.py: by name, round robin, a fixture's
        # tests kept together (ctest adds a fixture's setup to any run that
        # needs it), valgrind_signing alone (RUN_SERIAL, about 7.5 min) in
        # the shard "serial" of the build without sanitizers. The job
        # "build shards cover every test once" checks the lists.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          re=$(python3 -I tools/ctest-shard.py build "$SHARD" 2 --serial '^valgrind_signing$')
          [ -n "$re" ] || { echo "::error::shard $SHARD has no tests"; exit 1; }
          mkdir -p "$RUNNER_TEMP/lists"
          ctest --test-dir build -N -LE slow | sed -n 's/^ *Test *#[0-9]*: //p' | sort > "$RUNNER_TEMP/lists/full.txt"
          ctest --test-dir build -N -LE slow -R "$re" | sed -n 's/^ *Test *#[0-9]*: //p' | sort > "$RUNNER_TEMP/lists/shard.txt"
          echo "shard $SHARD: $(wc -l < "$RUNNER_TEMP/lists/shard.txt") of $(wc -l < "$RUNNER_TEMP/lists/full.txt") tests:"
          tr '\n' ' ' < "$RUNNER_TEMP/lists/shard.txt"; echo
          ctest --test-dir build --output-on-failure --timeout 600 -LE slow -j "$(nproc)" -R "$re"
      - name: Keep this shard's test list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-list-${{ env.SANITIZE }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/lists
          retention-days: 7
          if-no-files-found: error
      - name: Keep the program tests' logs when a test fails
        # Each process of a tests/program run writes NAME.log in its folder
        # under build/program (gzp_harness.py); they stay on the runner otherwise.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-build-OFF-${{ matrix.shard }}
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Chain worker under ThreadSanitizer
        # Watches, requests, events, resets and shutdown racing
        # (ports/chain/tests/test_chainw.c). Its own small build: TSan does
        # not mix with the other sanitizers. Fewer address-randomisation bits,
        # which this kernel's default exceeds what TSan can map. Once, in shard 1.
        if: matrix.shard == '1'
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          sh tools/chain-tsan.sh "$RUNNER_TEMP/chain-tsan"
      - name: Chain adapter's lookups beside its worker, under ThreadSanitizer
        # program/pchain.c: the loop's lookups (--check-chain) while the chain
        # worker polls, against a local Esplora stub. One chain client used by
        # both threads corrupted the heap (docs/notes/integration.md B11).
        if: matrix.shard == '1'
        run: sh tools/pchain-tsan.sh "$RUNNER_TEMP/pchain-tsan"
      - name: Scale check, one small case; the two former builder defects stay gone
        if: matrix.shard == '1'
        run: ./build/tree_shapes 64 8,ps 0 && ./build/tree_shapes defects

  # The required check "build (OFF)": passes only if every shard passed.
  build-off:
    name: build (OFF)
    needs: [build-off-shard, build-shard-lists]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed, and together they ran every test once
        env:
          RESULT: ${{ needs.build-off-shard.result }}
          LISTS: ${{ needs.build-shard-lists.result }}
        run: |
          echo "build (OFF) shards: $RESULT; shard lists: $LISTS"
          [ "$RESULT" = success ] || { echo "::error::a build (OFF) shard failed or was cancelled ($RESULT)"; exit 1; }
          [ "$LISTS" = success ] || { echo "::error::the shards do not cover every test exactly once ($LISTS)"; exit 1; }

  build-on-shard:
    name: build (ON, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
    env:
      SANITIZE: "ON"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, configure and build (gcc, Release, GZ_SANITIZE=ON, GZ_INTEROP_PY)
        # .github/actions/gz-build/configs.sh: gcc-on. One shard saves the
        # compiler cache.
        uses: ./.github/actions/gz-build
        with:
          config: gcc-on
          save-cache: ${{ matrix.shard == '1' }}
      - name: Test
        # Reference tree; core (action list, runner, node, isolation check and
        # its negative test); simulator (generator, harness, known trace,
        # 1,000 seeds, nine extreme fault profiles); and, in the build without
        # sanitizers, the same tests again under valgrind. The wallet
        # break-checks (label slow) run in wallet-break-checks.yml.
        # Sharded by tools/ctest-shard.py: by name, round robin, a fixture's
        # tests kept together (ctest adds a fixture's setup to any run that
        # needs it), valgrind_signing alone (RUN_SERIAL, about 7.5 min) in
        # the shard "serial" of the build without sanitizers. The job
        # "build shards cover every test once" checks the lists.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          re=$(python3 -I tools/ctest-shard.py build "$SHARD" 2 --serial '^valgrind_signing$')
          [ -n "$re" ] || { echo "::error::shard $SHARD has no tests"; exit 1; }
          mkdir -p "$RUNNER_TEMP/lists"
          ctest --test-dir build -N -LE slow | sed -n 's/^ *Test *#[0-9]*: //p' | sort > "$RUNNER_TEMP/lists/full.txt"
          ctest --test-dir build -N -LE slow -R "$re" | sed -n 's/^ *Test *#[0-9]*: //p' | sort > "$RUNNER_TEMP/lists/shard.txt"
          echo "shard $SHARD: $(wc -l < "$RUNNER_TEMP/lists/shard.txt") of $(wc -l < "$RUNNER_TEMP/lists/full.txt") tests:"
          tr '\n' ' ' < "$RUNNER_TEMP/lists/shard.txt"; echo
          ctest --test-dir build --output-on-failure --timeout 600 -LE slow -j "$(nproc)" -R "$re"
      - name: Keep this shard's test list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-list-${{ env.SANITIZE }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/lists
          retention-days: 7
          if-no-files-found: error
      - name: Keep the program tests' logs when a test fails
        # Each process of a tests/program run writes NAME.log in its folder
        # under build/program (gzp_harness.py); they stay on the runner otherwise.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-build-ON-${{ matrix.shard }}
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Scale check, one small case; the two former builder defects stay gone
        if: matrix.shard == '1'
        run: ./build/tree_shapes 64 8,ps 0 && ./build/tree_shapes defects

  # The required check "build (ON)": passes only if every shard passed.
  build-on:
    name: build (ON)
    needs: [build-on-shard, build-shard-lists]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed, and together they ran every test once
        env:
          RESULT: ${{ needs.build-on-shard.result }}
          LISTS: ${{ needs.build-shard-lists.result }}
        run: |
          echo "build (ON) shards: $RESULT; shard lists: $LISTS"
          [ "$RESULT" = success ] || { echo "::error::a build (ON) shard failed or was cancelled ($RESULT)"; exit 1; }
          [ "$LISTS" = success ] || { echo "::error::the shards do not cover every test exactly once ($LISTS)"; exit 1; }

  # The union of each build's shard lists is its full test list, with no test
  # twice and none missing.
  build-shard-lists:
    name: build shards cover every test once
    needs: [build-off-shard, build-on-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ctest-list-*
          path: lists
      - name: Compare
        run: |
          fail=0
          for san in OFF ON; do
            set -- lists/ctest-list-$san-*
            [ -e "$1" ] || { echo "::error::no shard lists for build ($san)"; fail=1; continue; }
            full=$(mktemp); all=$(mktemp)
            cp "$1/full.txt" "$full"
            for d in "$@"; do cmp -s "$d/full.txt" "$full" || { echo "::error::$d: another full list"; fail=1; }; done
            cat lists/ctest-list-$san-*/shard.txt | sort > "$all"
            sort -u "$all" > "$all.u"
            dup=$(uniq -d "$all"); missing=$(comm -23 "$full" "$all.u"); extra=$(comm -13 "$full" "$all.u")
            echo "build ($san): $(wc -l < "$full") tests; shards: $(for d in "$@"; do printf '%s=%s ' "${d##*-}" "$(wc -l < "$d/shard.txt")"; done)"
            [ -z "$dup" ] || { echo "::error::build ($san): run twice: $dup"; fail=1; }
            [ -z "$missing" ] || { echo "::error::build ($san): never run: $missing"; fail=1; }
            [ -z "$extra" ] || { echo "::error::build ($san): not in the full list: $extra"; fail=1; }
          done
          exit $fail

  import-check:
    name: imported SuperScalar files unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tools/check-import.sh

  no-addresses:
    name: no addresses or local paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I tools/check-no-addresses.py
      - name: The check itself refuses link targets, server paths and commit messages
        run: python3 -I tests/tools/test_check_no_addresses.py

  spec-vectors:
    name: specification vectors
    runs-on: ubuntu-24.04
    # Pure-Python elliptic-curve arithmetic: about five minutes on specs-slice1.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recompute the vectors printed in the specifications
        run: |
          if [ ! -f tools/spec-vectors.py ]; then
            echo "::notice::tools/spec-vectors.py is not on this branch; nothing to check."
            exit 0
          fi
          python3 -I tools/spec-vectors.py

  handbook:
    name: handbook up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Markdown renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/hb"
          "$RUNNER_TEMP/hb/bin/python" -m pip install --quiet --require-hashes -r tools/handbook-requirements.txt
      - name: Rebuild docs/handbook.html and compare
        # The two lines that carry the build date are the only ones allowed to
        # differ; everything else must match the committed page.
        run: |
          "$RUNNER_TEMP/hb/bin/python" -I tools/build-handbook.py
          git diff --exit-code \
            -I '^<p class="lead">Every project document in one file\.' \
            -I '^ "built": "[0-9-]*",$' \
            -- docs/handbook.html \
            || { echo "::error::docs/handbook.html is stale: run python tools/build-handbook.py and commit it."; exit 1; }

  clang:
    name: clang (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            config: clang-plain
          - name: ASan+UBSan
            config: clang-asan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, configure and build (clang 18, Release, GZ_SANITIZE OFF or ON)
        # .github/actions/gz-build/configs.sh: clang-plain, clang-asan (CC=clang-18).
        uses: ./.github/actions/gz-build
        with:
          config: ${{ matrix.config }}
      - name: Test
        # The slow wallet break-checks run in the gcc build only.
        run: ctest --test-dir build --output-on-failure --timeout 600 -LE slow -j "$(nproc)"
      - name: Keep the program tests' logs when a test fails
        # Each process of a tests/program run writes NAME.log in its folder
        # under build/program (gzp_harness.py); they stay on the runner otherwise.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-clang-${{ matrix.name }}
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  msan:
    name: clang MemorySanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Heavy tier (docs/notes/ci.md, "Tiers"): the merge queue, main, the
    # nightly run, a dispatch with tier=full, pull requests labelled full-ci,
    # and every pull request into integration-slice1 or composite-p6a (which
    # have no merge queue). Skipped by this if on other pull requests, which
    # GitHub reports as a pass; the merge queue then runs it for real.
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["integration-slice1", "composite-p6a"]'), github.base_ref))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, configure and build (clang 18, MemorySanitizer, OpenSSL built with it)
        # .github/actions/gz-build/configs.sh: msan. OpenSSL 3.0.22 is built
        # from its release source, checked against its SHA-256, and cached;
        # secp256k1's x86-64 assembly is off (MSan cannot see what it writes).
        uses: ./.github/actions/gz-build
        with:
          config: msan
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900 -LE slow -j "$(nproc)"
      - name: Keep the program tests' logs when a test fails
        # Each process of a tests/program run writes NAME.log in its folder
        # under build/program (gzp_harness.py); they stay on the runner otherwise.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-msan
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  # Every compiled test under memcheck, in three shards over the same list
  # (tools/valgrind-tests.py --shard I/3: by name order, every third test), so
  # each test runs under valgrind exactly once. The job "valgrind" below is the
  # required check: it passes only if all three shards did.
  valgrind-shard:
    name: valgrind (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Heavy tier: the same condition as msan's (docs/notes/ci.md, "Tiers").
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["integration-slice1", "composite-p6a"]'), github.base_ref))
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, configure and build (gcc, RelWithDebInfo, no sanitizer)
        # .github/actions/gz-build/configs.sh: valgrind. Shard 0 saves the
        # compiler cache.
        uses: ./.github/actions/gz-build
        with:
          config: valgrind
          save-cache: ${{ matrix.shard == 0 }}
      - name: Every compiled test under memcheck
        # tools/ci-valgrind.py holds the shorter cases (200 simulator seeds
        # instead of 1,000, the signing sections' "tiny" sets, short fuzz
        # runs) and leaves out storage_vector_e2r (Argon2id at 256 MiB, E2's
        # code at more memory); agent-run.yml uses the same list.
        run: python3 -I tools/ci-valgrind.py build --shard ${{ matrix.shard }}/3
      - name: Storage and signing constant-time checks (secrets marked undefined, under memcheck)
        # Registered only where valgrind and its headers are installed: here.
        # Once, in the first shard.
        if: matrix.shard == 0
        run: ctest --test-dir build -R '^(storage|signing|signer)_ctime$' --output-on-failure --no-tests=error
      - name: Keep the program tests' logs when a test fails
        # As in the build jobs (#64); the program tests are scripts, which
        # memcheck does not run, so this is usually empty.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-valgrind-${{ matrix.shard }}
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  # The constant-time checks again in a Debug build (-O0). Optimisation can
  # turn a branch on a secret into straight-line code, so a Release build can
  # pass where the code is not constant time: unoptimised, `a && b` on two
  # secret-dependent results is a branch (signing.c's make_nonce did this).
  # Every other job builds with optimisation.
  ctime-debug:
    name: constant time (Debug build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Heavy tier: the same condition as msan's (docs/notes/ci.md, "Tiers").
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["integration-slice1", "composite-p6a"]'), github.base_ref))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, configure and build (gcc, Debug, no optimisation)
        # .github/actions/gz-build/configs.sh: debug.
        uses: ./.github/actions/gz-build
        with:
          config: debug
      - name: The constant-time tests under memcheck, unoptimised
        # Each expected test must be registered, exactly once: a test that
        # stopped being registered (valgrind's headers missing, a renamed
        # target) fails the job instead of passing it unrun. program_keys_ct
        # joins this list when the program's key layer (#53) merges.
        run: |
          tests="signing_ctime signer_ctime"
          for t in $tests; do
            n=$(ctest --test-dir build -N -R "^$t\$" | sed -n 's/^Total Tests: *//p')
            [ "$n" = 1 ] || { echo "::error::$t is registered $n times, not once"; exit 1; }
          done
          ctest --test-dir build -R "^($(echo $tests | tr ' ' '|'))\$" --output-on-failure

  valgrind:
    name: valgrind
    needs: valgrind-shard
    runs-on: ubuntu-24.04
    # always(): it runs, and fails, when a shard failed. Heavy tier: the same
    # condition as msan's (docs/notes/ci.md, "Tiers"). On a pull request
    # without full-ci both the shards and this job are skipped, which
    # GitHub reports as a pass for the required check "valgrind".
    if: >-
      always() && (github.event_name == 'merge_group' || github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["integration-slice1", "composite-p6a"]'), github.base_ref)))
    timeout-minutes: 5
    steps:
      - name: All three shards passed
        env:
          RESULT: ${{ needs.valgrind-shard.result }}
        run: |
          echo "valgrind shards: $RESULT"
          [ "$RESULT" = success ] || { echo "::error::a valgrind shard failed or was cancelled ($RESULT)"; exit 1; }

  fuzz:
    name: libFuzzer, 60 s per target
    runs-on: ubuntu-24.04
    # One minute per target, plus the build: 17 targets took 19 min 21 s.
    timeout-minutes: 30
    # Heavy tier: the same condition as msan's (docs/notes/ci.md, "Tiers").
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["integration-slice1", "composite-p6a"]'), github.base_ref))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for fuzz targets
        id: find
        run: |
          if git grep -q -l LLVMFuzzerTestOneInput -- '*.c'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            git grep -l LLVMFuzzerTestOneInput -- '*.c'
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No fuzz targets on this branch (no LLVMFuzzerTestOneInput); nothing to run."
          fi
      - name: Install, configure and build (clang 18, libFuzzer, ASan+UBSan)
        # .github/actions/gz-build/configs.sh: fuzz (CC=clang-18).
        if: steps.find.outputs.found == 'true'
        uses: ./.github/actions/gz-build
        with:
          config: fuzz
      - name: Run each target for 60 seconds
        if: steps.find.outputs.found == 'true'
        run: sh tools/run-fuzz.sh build 60

  interface:
    name: interface in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build gz-api-fake (the API server, the fake backend, the interface compiled in) and gazpacho-test
        # .github/actions/gz-build/configs.sh: interface.
        uses: ./.github/actions/gz-build
        with:
          config: interface
          targets: gz-api-fake gazpacho-test
      - name: Install Playwright (pinned by tests/web/package-lock.json) and Chromium
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: The interface, every Slice 1 flow, against the fake backend
        working-directory: tests/web
        # GZ_PROGRAM: tests/web/multiprocess.spec.mjs drives real gazpacho-test processes
        run: GZ_API_FAKE="$GITHUB_WORKSPACE/build/ports/api/gz-api-fake" GZ_PROGRAM="$GITHUB_WORKSPACE/build/program/gazpacho-test" npx playwright test
      - name: The API server's own browser checks (spec/local-api.md 23.6)
        working-directory: tests/api/browser
        run: |
          ln -s ../../web/node_modules node_modules
          GZ_API_FAKE="$GITHUB_WORKSPACE/build/ports/api/gz-api-fake" npx playwright test

  # The signer boundary, step S1 (docs/notes/signer.md 7, 9). The boundary
  # check fails on any growth (review A of #71, M2) and on any hard finding;
  # check-tags reports only until PROTOCOL.md 8.2 registers today's strings.
  # Their own tests and the vectors check fail the job too.
  signer-boundary:
    name: signer boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pull-requests: read, to read the queued pull request's labels
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the merge commit and its first parent, the base branch: the allow
          # list is compared with the base's
          fetch-depth: 2
      - name: The checks refuse what they must (their own tests)
        run: |
          python3 -I tests/tools/test_check_signer_boundary.py
          python3 -I tests/tools/test_check_tags.py
      - name: Signing and secret-key symbols outside signer/ (no growth, and the allow list only shrinks)
        # A pull request whose allow list must grow says so with the label
        # signer-boundary-growth, which a reviewer of the signer boundary sets.
        # On a pull request the label is read through the API when the job
        # runs, not from the event, so a re-run of this job sees a label added
        # since (ci-label.yml re-runs it when the label is added); if the
        # lookup fails, the event's labels are used. In the merge queue the base is the queue's base_sha, and the label is
        # read from the pull request the queue's head ref names (the queue
        # event carries no labels). If that lookup fails in any way, the
        # queue fails closed: the list may not grow. A growth PR whose
        # lookup fails merges outside the queue, after maintainer review
        # (docs/notes/ci.md).
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'signer-boundary-growth') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          base=""
          growth=false
          case "$GITHUB_EVENT_NAME" in
          pull_request)
            base=HEAD^1
            if labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' 2>/dev/null); then
              if printf '%s\n' "$labels" | grep -qx signer-boundary-growth; then growth=true; fi
            else
              echo "::warning::could not read the pull request's labels; using the event's"
              growth=$PR_LABEL
            fi
            ;;
          merge_group)
            git fetch --no-tags --depth=1 origin "$QUEUE_BASE"
            base=$QUEUE_BASE
            # refs/heads/gh-readonly-queue/<branch>/pr-<number>-<sha>
            pr=$(printf '%s\n' "$QUEUE_REF" | sed -n 's|^refs/heads/gh-readonly-queue/.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$|\1|p')
            if [ -n "$pr" ] &&
               labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.labels[].name' 2>/dev/null); then
              if printf '%s\n' "$labels" | grep -qx signer-boundary-growth; then growth=true; fi
            else
              echo "::warning::could not read the labels of the queued pull request ($QUEUE_REF): the allow list may not grow"
            fi
            ;;
          esac
          if [ -n "$base" ] && [ "$growth" != true ]; then
            if git show "$base:tools/signer-boundary-allowed.txt" > "$RUNNER_TEMP/base-allow.txt" 2>/dev/null; then
              # the symbol list may only grow: a symbol deleted in the same
              # change as a new use of it is growth too
              git show "$base:tools/signer-only-symbols.txt" > "$RUNNER_TEMP/base-symbols.txt"
              sh tools/check-signer-boundary.sh --no-growth --base-allow "$RUNNER_TEMP/base-allow.txt" \
                --base-symbols "$RUNNER_TEMP/base-symbols.txt"
            elif [ "$GITHUB_EVENT_NAME" = merge_group ] &&
                 git cat-file -e "$base:tools/check-signer-boundary.sh" 2>/dev/null; then
              # the base has the check but no allow list: something is wrong
              echo "::error::the merge queue's base has no allow list"; exit 1
            else
              # the base predates the allow list (the pull request that adds it)
              sh tools/check-signer-boundary.sh --no-growth
            fi
          else
            sh tools/check-signer-boundary.sh --no-growth
          fi
      - name: Unregistered gazpacho/ strings (report only)
        run: python3 -I tools/check-tags.py --report
      - name: The signer's vectors, recomputed in pure Python
        run: python3 -I tools/signer-vectors.py --check signer/tests/vectors.txt

  # The composite node's mutants (tests/node/mutants.txt, tools/mutate-node.py),
  # in six shards: each mutant must be killed by a node test, or triaged in the
  # list with a reason. Not required for merging.
  node-mutants-shard:
    name: node mutants (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Heavy tier: the same condition as msan's (docs/notes/ci.md, "Tiers").
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["integration-slice1", "composite-p6a"]'), github.base_ref))
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev
      - name: Every node mutant of this shard is killed or triaged
        run: python3 -I tools/mutate-node.py . "$RUNNER_TEMP/node-mutants" -j "$(nproc)" --shard ${{ matrix.shard }}/6

  signer-mutants-run:
    name: signer mutants (run)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Heavy tier: the same condition as msan's (docs/notes/ci.md, "Tiers").
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["integration-slice1", "composite-p6a"]'), github.base_ref))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev valgrind
      - name: Every check of signer/ and of the two S1 tools is killed by a test
        run: python3 -I tools/mutate-signer.py . "$RUNNER_TEMP/signer-mutants" -j "$(nproc)"

  # The stable name for the six node mutant shards: like "valgrind", it passes only if every one
  # of its jobs passed, and is skipped with them outside the heavy tier.
  # Not required; whether it becomes required is the owner's decision.
  node-mutants:
    name: node mutants
    needs: node-mutants-shard
    runs-on: ubuntu-24.04
    if: >-
      always() && (github.event_name == 'merge_group' || github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["integration-slice1", "composite-p6a"]'), github.base_ref)))
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULT: ${{ needs.node-mutants-shard.result }}
        run: |
          echo "node mutants: $RESULT"
          [ "$RESULT" = success ] || { echo "::error::node mutants: a job failed or was cancelled ($RESULT)"; exit 1; }

  # The stable name for the signer mutants: like "valgrind", it passes only if every one
  # of its jobs passed, and is skipped with them outside the heavy tier.
  # Not required; whether it becomes required is the owner's decision.
  signer-mutants:
    name: signer mutants
    needs: signer-mutants-run
    runs-on: ubuntu-24.04
    if: >-
      always() && (github.event_name == 'merge_group' || github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      (github.event_name == 'pull_request' &&
       contains(fromJSON('["integration-slice1", "composite-p6a"]'), github.base_ref)))
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULT: ${{ needs.signer-mutants-run.result }}
        run: |
          echo "signer mutants: $RESULT"
          [ "$RESULT" = success ] || { echo "::error::signer mutants: a job failed or was cancelled ($RESULT)"; exit 1; }
