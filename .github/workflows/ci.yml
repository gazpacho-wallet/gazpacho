name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue: every required check runs on the queue's merge commit.
  merge_group:

# The token GitHub gives each job can only read the repository. No job here
# needs more; a job that does must ask for it itself.
permissions:
  contents: read

# A newer push to the same pull request cancels the run it makes stale. A
# merge queue run has a ref of its own (gh-readonly-queue/...) and is never
# cancelled here.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every third-party action is pinned to a full commit SHA; the comment names
# the release. Update both together. What each job guards: docs/notes/ci.md.
jobs:
  build-off-shard:
    name: build (OFF, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
          - shard: serial
    env:
      SANITIZE: "OFF"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev valgrind python3-cryptography
      - name: Configure
        # GZ_INTEROP_PY: gz-net against the independent Python peer (BOLT 8,
        # and BOLT 1 init, ping and pong with factory messages).
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGZ_SANITIZE=$SANITIZE -DGZ_WERROR=ON -DGZ_INTEROP_PY=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        # Reference tree; core (action list, runner, node, isolation check and
        # its negative test); simulator (generator, harness, known trace,
        # 1,000 seeds, nine extreme fault profiles); and, in the build without
        # sanitizers, the same tests again under valgrind. The wallet
        # break-checks (label slow) run in wallet-break-checks.yml.
        # Sharded by tools/ctest-shard.py: by name, round robin, a fixture's
        # tests kept together (ctest adds a fixture's setup to any run that
        # needs it), valgrind_signing alone (RUN_SERIAL, about 7.5 min) in
        # the shard "serial" of the build without sanitizers. The job
        # "build shards cover every test once" checks the lists.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          re=$(python3 -I tools/ctest-shard.py build "$SHARD" 2 --serial '^valgrind_signing$')
          [ -n "$re" ] || { echo "::error::shard $SHARD has no tests"; exit 1; }
          mkdir -p "$RUNNER_TEMP/lists"
          ctest --test-dir build -N -LE slow | sed -n 's/^ *Test *#[0-9]*: //p' | sort > "$RUNNER_TEMP/lists/full.txt"
          ctest --test-dir build -N -LE slow -R "$re" | sed -n 's/^ *Test *#[0-9]*: //p' | sort > "$RUNNER_TEMP/lists/shard.txt"
          echo "shard $SHARD: $(wc -l < "$RUNNER_TEMP/lists/shard.txt") of $(wc -l < "$RUNNER_TEMP/lists/full.txt") tests:"
          tr '\n' ' ' < "$RUNNER_TEMP/lists/shard.txt"; echo
          ctest --test-dir build --output-on-failure --timeout 600 -LE slow -j "$(nproc)" -R "$re"
      - name: Keep this shard's test list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-list-${{ env.SANITIZE }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/lists
          retention-days: 7
          if-no-files-found: error
      - name: Keep the program tests' logs when a test fails
        # Each process of a tests/program run writes NAME.log in its folder
        # under build/program (gzp_harness.py); they stay on the runner otherwise.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-build-OFF-${{ matrix.shard }}
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Chain worker under ThreadSanitizer
        # Watches, requests, events, resets and shutdown racing
        # (ports/chain/tests/test_chainw.c). Its own small build: TSan does
        # not mix with the other sanitizers. Fewer address-randomisation bits,
        # which this kernel's default exceeds what TSan can map. Once, in shard 1.
        if: matrix.shard == '1'
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          sh tools/chain-tsan.sh "$RUNNER_TEMP/chain-tsan"
      - name: Chain adapter's lookups beside its worker, under ThreadSanitizer
        # program/pchain.c: the loop's lookups (--check-chain) while the chain
        # worker polls, against a local Esplora stub. One chain client used by
        # both threads corrupted the heap (docs/notes/integration.md B11).
        if: matrix.shard == '1'
        run: sh tools/pchain-tsan.sh "$RUNNER_TEMP/pchain-tsan"
      - name: Scale check, one small case; the two former builder defects stay gone
        if: matrix.shard == '1'
        run: ./build/tree_shapes 64 8,ps 0 && ./build/tree_shapes defects

  # The required check "build (OFF)": passes only if every shard passed.
  build-off:
    name: build (OFF)
    needs: [build-off-shard, build-shard-lists]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed, and together they ran every test once
        env:
          RESULT: ${{ needs.build-off-shard.result }}
          LISTS: ${{ needs.build-shard-lists.result }}
        run: |
          echo "build (OFF) shards: $RESULT; shard lists: $LISTS"
          [ "$RESULT" = success ] || { echo "::error::a build (OFF) shard failed or was cancelled ($RESULT)"; exit 1; }
          [ "$LISTS" = success ] || { echo "::error::the shards do not cover every test exactly once ($LISTS)"; exit 1; }

  build-on-shard:
    name: build (ON, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
    env:
      SANITIZE: "ON"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev valgrind python3-cryptography
      - name: Configure
        # GZ_INTEROP_PY: gz-net against the independent Python peer (BOLT 8,
        # and BOLT 1 init, ping and pong with factory messages).
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGZ_SANITIZE=$SANITIZE -DGZ_WERROR=ON -DGZ_INTEROP_PY=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        # Reference tree; core (action list, runner, node, isolation check and
        # its negative test); simulator (generator, harness, known trace,
        # 1,000 seeds, nine extreme fault profiles); and, in the build without
        # sanitizers, the same tests again under valgrind. The wallet
        # break-checks (label slow) run in wallet-break-checks.yml.
        # Sharded by tools/ctest-shard.py: by name, round robin, a fixture's
        # tests kept together (ctest adds a fixture's setup to any run that
        # needs it), valgrind_signing alone (RUN_SERIAL, about 7.5 min) in
        # the shard "serial" of the build without sanitizers. The job
        # "build shards cover every test once" checks the lists.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          re=$(python3 -I tools/ctest-shard.py build "$SHARD" 2 --serial '^valgrind_signing$')
          [ -n "$re" ] || { echo "::error::shard $SHARD has no tests"; exit 1; }
          mkdir -p "$RUNNER_TEMP/lists"
          ctest --test-dir build -N -LE slow | sed -n 's/^ *Test *#[0-9]*: //p' | sort > "$RUNNER_TEMP/lists/full.txt"
          ctest --test-dir build -N -LE slow -R "$re" | sed -n 's/^ *Test *#[0-9]*: //p' | sort > "$RUNNER_TEMP/lists/shard.txt"
          echo "shard $SHARD: $(wc -l < "$RUNNER_TEMP/lists/shard.txt") of $(wc -l < "$RUNNER_TEMP/lists/full.txt") tests:"
          tr '\n' ' ' < "$RUNNER_TEMP/lists/shard.txt"; echo
          ctest --test-dir build --output-on-failure --timeout 600 -LE slow -j "$(nproc)" -R "$re"
      - name: Keep this shard's test list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-list-${{ env.SANITIZE }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/lists
          retention-days: 7
          if-no-files-found: error
      - name: Keep the program tests' logs when a test fails
        # Each process of a tests/program run writes NAME.log in its folder
        # under build/program (gzp_harness.py); they stay on the runner otherwise.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-build-ON-${{ matrix.shard }}
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Scale check, one small case; the two former builder defects stay gone
        if: matrix.shard == '1'
        run: ./build/tree_shapes 64 8,ps 0 && ./build/tree_shapes defects

  # The required check "build (ON)": passes only if every shard passed.
  build-on:
    name: build (ON)
    needs: [build-on-shard, build-shard-lists]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed, and together they ran every test once
        env:
          RESULT: ${{ needs.build-on-shard.result }}
          LISTS: ${{ needs.build-shard-lists.result }}
        run: |
          echo "build (ON) shards: $RESULT; shard lists: $LISTS"
          [ "$RESULT" = success ] || { echo "::error::a build (ON) shard failed or was cancelled ($RESULT)"; exit 1; }
          [ "$LISTS" = success ] || { echo "::error::the shards do not cover every test exactly once ($LISTS)"; exit 1; }

  # The union of each build's shard lists is its full test list, with no test
  # twice and none missing.
  build-shard-lists:
    name: build shards cover every test once
    needs: [build-off-shard, build-on-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ctest-list-*
          path: lists
      - name: Compare
        run: |
          fail=0
          for san in OFF ON; do
            set -- lists/ctest-list-$san-*
            [ -e "$1" ] || { echo "::error::no shard lists for build ($san)"; fail=1; continue; }
            full=$(mktemp); all=$(mktemp)
            cp "$1/full.txt" "$full"
            for d in "$@"; do cmp -s "$d/full.txt" "$full" || { echo "::error::$d: another full list"; fail=1; }; done
            cat lists/ctest-list-$san-*/shard.txt | sort > "$all"
            sort -u "$all" > "$all.u"
            dup=$(uniq -d "$all"); missing=$(comm -23 "$full" "$all.u"); extra=$(comm -13 "$full" "$all.u")
            echo "build ($san): $(wc -l < "$full") tests; shards: $(for d in "$@"; do printf '%s=%s ' "${d##*-}" "$(wc -l < "$d/shard.txt")"; done)"
            [ -z "$dup" ] || { echo "::error::build ($san): run twice: $dup"; fail=1; }
            [ -z "$missing" ] || { echo "::error::build ($san): never run: $missing"; fail=1; }
            [ -z "$extra" ] || { echo "::error::build ($san): not in the full list: $extra"; fail=1; }
          done
          exit $fail

  import-check:
    name: imported SuperScalar files unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tools/check-import.sh

  no-addresses:
    name: no addresses or local paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I tools/check-no-addresses.py
      - name: The check itself refuses link targets, server paths and commit messages
        run: python3 -I tests/tools/test_check_no_addresses.py

  spec-vectors:
    name: specification vectors
    runs-on: ubuntu-24.04
    # Pure-Python elliptic-curve arithmetic: about five minutes on specs-slice1.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recompute the vectors printed in the specifications
        run: |
          if [ ! -f tools/spec-vectors.py ]; then
            echo "::notice::tools/spec-vectors.py is not on this branch; nothing to check."
            exit 0
          fi
          python3 -I tools/spec-vectors.py

  handbook:
    name: handbook up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Markdown renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/hb"
          "$RUNNER_TEMP/hb/bin/python" -m pip install --quiet --require-hashes -r tools/handbook-requirements.txt
      - name: Rebuild docs/handbook.html and compare
        # The two lines that carry the build date are the only ones allowed to
        # differ; everything else must match the committed page.
        run: |
          "$RUNNER_TEMP/hb/bin/python" -I tools/build-handbook.py
          git diff --exit-code \
            -I '^<p class="lead">Every project document in one file\.' \
            -I '^ "built": "[0-9-]*",$' \
            -- docs/handbook.html \
            || { echo "::error::docs/handbook.html is stale: run python tools/build-handbook.py and commit it."; exit 1; }

  clang:
    name: clang (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            sanitize: OFF
          - name: ASan+UBSan
            sanitize: ON
    env:
      CC: clang-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang-18 libclang-rt-18-dev libssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGZ_SANITIZE=${{ matrix.sanitize }} -DGZW_BREAK_CHECKS=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        # The slow wallet break-checks run in the gcc build only.
        run: ctest --test-dir build --output-on-failure --timeout 600 -LE slow -j "$(nproc)"
      - name: Keep the program tests' logs when a test fails
        # Each process of a tests/program run writes NAME.log in its folder
        # under build/program (gzp_harness.py); they stay on the runner otherwise.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-clang-${{ matrix.name }}
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  msan:
    name: clang MemorySanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CC: clang-18
      OPENSSL_VERSION: 3.0.22
      OPENSSL_SHA256: 67ebca7e50d17383028045486653492195b83db95f8558709701bb47b5c1ef81
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang-18 libclang-rt-18-dev
      - name: Cache OpenSSL built with MemorySanitizer
        id: openssl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/openssl-msan
          key: openssl-${{ env.OPENSSL_VERSION }}-msan-clang18-ubuntu24.04-v1
      - name: Build OpenSSL with MemorySanitizer
        # Every library the tests call must be instrumented, or MSan reports
        # the bytes it returns as uninitialised. libcrypto only, static.
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  openssl.tar.gz" | sha256sum --check --strict
          tar xzf openssl.tar.gz
          cd "openssl-$OPENSSL_VERSION"
          ./Configure linux-x86_64-clang enable-msan no-asm no-shared no-tests no-module \
            --prefix="$HOME/openssl-msan" --libdir=lib CC=clang-18 \
            CFLAGS="-fsanitize-memory-track-origins -fno-omit-frame-pointer -g -O1" > /dev/null
          make -j"$(nproc)" build_libs > /dev/null
          make install_dev > /dev/null
      - name: Configure
        # secp256k1's x86-64 assembly is off: MSan cannot see what assembly writes.
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGZW_BREAK_CHECKS=OFF
          -DCMAKE_C_FLAGS="-fsanitize=memory -fsanitize-memory-track-origins -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=memory"
          -DSECP256K1_ASM=OFF
          -DOPENSSL_ROOT_DIR="$HOME/openssl-msan" -DOPENSSL_USE_STATIC_LIBS=TRUE
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900 -LE slow -j "$(nproc)"
      - name: Keep the program tests' logs when a test fails
        # Each process of a tests/program run writes NAME.log in its folder
        # under build/program (gzp_harness.py); they stay on the runner otherwise.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-msan
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  # Every compiled test under memcheck, in three shards over the same list
  # (tools/valgrind-tests.py --shard I/3: by name order, every third test), so
  # each test runs under valgrind exactly once. The job "valgrind" below is the
  # required check: it passes only if all three shards did.
  valgrind-shard:
    name: valgrind (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev valgrind
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGZW_BREAK_CHECKS=OFF
      - name: Build
        run: cmake --build build -j
      - name: Every compiled test under memcheck
        # The 1,000-seed simulator run takes over eight minutes under valgrind;
        # 200 seeds of the same length here, all 1,000 in every other build.
        # storage_vector_e2r (Argon2id at 256 MiB) is E2's code at more memory.
        # The signing sections run their "tiny" sets (every path, fewer seeds)
        # and the engine fuzzer a short run: the full sets take hours here.
        run: >
          python3 -I tools/valgrind-tests.py build --shard ${{ matrix.shard }}/3
          --args "sim_seeds=200 400 1 0" --args "journal_fuzz=3000 7"
          --args "journal_fuzz_model=200 1" --args "journal_fuzz_open=3000 1"
          --args "lobby_sim_profile_0=3 0" --args "lobby_sim_profile_1=3 1"
          --args "lobby_sim_profile_2=3 2" --args "lobby_sim_profile_3=3 3"
          --args "lobby_fuzz=3000 2" --args "lobby_fuzz_seq=300 2"
          --args "api_http_fuzz=3000" --args "api_json_fuzz=20000"
          --args "node_fuzz=300" --args "node_hostile=6 400" --args "sim_profile_6=25 300 1 6"
          --args "node_lobby=1500 1" --args "lobby_hostile=3000 2"
          --args "chain_fuzz_parse=20000" --args "chain_fuzz_watch=1500"
          --args "journal_fuzz_sealed=300" --args "storage_fuzz_sc_counter=2000"
          --exclude '^storage_vector_e2r$'
          --args "signing_blocks=blocks tiny" --args "signing_decoders=decoders tiny"
          --args "signing_golden=golden tiny" --args "signing_model=model tiny"
          --args "signing_faults=faults tiny" --args "signing_honest=honest tiny"
          --args "signing_t1=t1 tiny" --args "signing_crashes=crashes tiny"
          --args "signing_restores=restores tiny" --args "signing_errors=errors tiny"
          --args "signing_fuzz=1000 2"
          --args "signing_fuzz_replay=1000"
          --args "fuzz_tree_agree=40"
      - name: Storage and signing constant-time checks (secrets marked undefined, under memcheck)
        # Registered only where valgrind and its headers are installed: here.
        # Once, in the first shard.
        if: matrix.shard == 0
        run: ctest --test-dir build -R '^(storage|signing)_ctime$' --output-on-failure --no-tests=error
      - name: Keep the program tests' logs when a test fails
        # As in the build jobs (#64); the program tests are scripts, which
        # memcheck does not run, so this is usually empty.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-logs-valgrind-${{ matrix.shard }}
          path: build/program/**/*.log
          retention-days: 7
          if-no-files-found: ignore

  valgrind:
    name: valgrind
    needs: valgrind-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All three shards passed
        env:
          RESULT: ${{ needs.valgrind-shard.result }}
        run: |
          echo "valgrind shards: $RESULT"
          [ "$RESULT" = success ] || { echo "::error::a valgrind shard failed or was cancelled ($RESULT)"; exit 1; }

  fuzz:
    name: libFuzzer, 60 s per target
    runs-on: ubuntu-24.04
    # One minute per target, plus the build: 17 targets took 19 min 21 s.
    timeout-minutes: 30
    env:
      CC: clang-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for fuzz targets
        id: find
        run: |
          if git grep -q -l LLVMFuzzerTestOneInput -- '*.c'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            git grep -l LLVMFuzzerTestOneInput -- '*.c'
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No fuzz targets on this branch (no LLVMFuzzerTestOneInput); nothing to run."
          fi
      - name: Install dependencies
        if: steps.find.outputs.found == 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake clang-18 libclang-rt-18-dev libssl-dev
      - name: Configure
        if: steps.find.outputs.found == 'true'
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGZW_BREAK_CHECKS=OFF -DGZ_LIBFUZZER=ON
          -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        if: steps.find.outputs.found == 'true'
        run: cmake --build build -j
      - name: Run each target for 60 seconds
        if: steps.find.outputs.found == 'true'
        run: sh tools/run-fuzz.sh build 60

  interface:
    name: interface in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev
      - name: Build gz-api-fake (the API server, the fake backend, the interface compiled in) and gazpacho-test
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGZ_WERROR=ON -DGZW_BREAK_CHECKS=OFF
          cmake --build build --target gz-api-fake gazpacho-test -j
      - name: Install Playwright (pinned by tests/web/package-lock.json) and Chromium
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: The interface, every Slice 1 flow, against the fake backend
        working-directory: tests/web
        # GZ_PROGRAM: tests/web/multiprocess.spec.mjs drives real gazpacho-test processes
        run: GZ_API_FAKE="$GITHUB_WORKSPACE/build/ports/api/gz-api-fake" GZ_PROGRAM="$GITHUB_WORKSPACE/build/program/gazpacho-test" npx playwright test
      - name: The API server's own browser checks (spec/local-api.md 23.6)
        working-directory: tests/api/browser
        run: |
          ln -s ../../web/node_modules node_modules
          GZ_API_FAKE="$GITHUB_WORKSPACE/build/ports/api/gz-api-fake" npx playwright test
