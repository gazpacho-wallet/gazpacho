name: Nightly
# A schedule runs on the default branch only. ci.yml's own schedule is the
# nightly full run of main; this starts the same full run, by
# workflow_dispatch with tier=full, on the other long-lived branches, each
# with that branch's own ci.yml. A branch whose ci.yml has no
# workflow_dispatch yet (it has not merged main since the tiers came) gets a
# warning, not a run.
on:
  schedule:
    - cron: "23 2 * * *"

permissions: {}

jobs:
  dispatch:
    name: nightly full runs of the long-lived branches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: write, to start workflow_dispatch runs; nothing else
    permissions:
      actions: write
    steps:
      - name: Dispatch ci.yml with tier=full on integration-slice1 and composite-p6a
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in integration-slice1 composite-p6a; do
            if gh workflow run ci.yml -R "$GITHUB_REPOSITORY" -r "$b" -f tier=full; then
              echo "- $b: full run started" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::no nightly run on $b (the branch is gone, or its ci.yml has no workflow_dispatch yet)"
              echo "- $b: not started" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
