name: Regtest helpers
# Slice 1.5 plan, P7 (docs/SLICE-1.5-PLAN.md): the regtest helpers the
# Slice 1.5 tests lean on (tests/program/regtest_kit.py and the Esplora
# look-alike, tools/esplora-regtest.py) are checked on real Bitcoin Core 29.0
# and 29.1 nodes by program_regtest_helpers, and the program tests that use
# the look-alike run again on 29.1. Never a required check.
#
#   pull requests that touch the helpers, and on demand:
#     gh workflow run regtest-helpers.yml -R gazpacho-wallet/gazpacho -r <branch>
#
# Bitcoin Core is downloaded, never built: the exact pinned versions, each
# SHA256SUMS signed by at least three pinned guix.sigs builder keys, and each
# tarball's pinned hash, as #57's deep-checks.yml does. When #57 merges, this
# becomes part of its "regtest-paths" suite (plan 1.3).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/esplora-regtest.py
      - tests/program/regtest_kit.py
      - tests/program/regtest_helpers.py
      - tests/program/slice1.py
      - .github/workflows/regtest-helpers.yml

permissions:
  contents: read

concurrency:
  group: regtest-helpers-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  helpers:
    name: regtest helpers (Core 29.0 and 29.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # From each release's SHA256SUMS; checked again against the signed file below.
      CORE_29_0_SHA256: a681e4f6ce524c338a105f214613605bac6c33d58c31dc5135bbc02bc458bb6c
      CORE_29_1_SHA256: 2dddeaa8c0626ec446b6f21b64c0f3565a1e7e67ff0b586d25043cbd686c9455
      # Signatures from at least this many distinct builder keys of guix.sigs.
      CORE_MIN_SIGNERS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The builders' keys (bitcoin-core/guix.sigs, pinned commit of 2026-10-30)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitcoin-core/guix.sigs
          ref: fdc0f9635ca5bee7dd46c51f3bcf3afca83b2d5d
          path: guix.sigs
          sparse-checkout: builder-keys
          persist-credentials: false
      - name: Download Bitcoin Core 29.0 and 29.1 and verify them
        run: |
          set -eu
          sudo apt-get install -y gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          for k in "$GITHUB_WORKSPACE"/guix.sigs/builder-keys/*.gpg; do gpg --batch --quiet --import "$k" 2>/dev/null || echo "could not import $(basename "$k")"; done
          for v in 29.0 29.1; do
            d="$RUNNER_TEMP/core/$v"; mkdir -p "$d"; cd "$d"
            tarball="bitcoin-$v-x86_64-linux-gnu.tar.gz"
            case "$v" in 29.0) pinned="$CORE_29_0_SHA256" ;; 29.1) pinned="$CORE_29_1_SHA256" ;; esac
            base="https://bitcoincore.org/bin/bitcoin-core-$v"
            curl -fsSL --proto '=https' -o SHA256SUMS "$base/SHA256SUMS"
            curl -fsSL --proto '=https' -o SHA256SUMS.asc "$base/SHA256SUMS.asc"
            curl -fsSL --proto '=https' -o "$tarball" "$base/$tarball"
            # 1. The signatures: the keyring holds only the builders' keys.
            gpg --batch --status-fd 1 --verify SHA256SUMS.asc SHA256SUMS > gpg-status.txt 2> gpg-log.txt || true
            if grep -q '^\[GNUPG:\] BADSIG' gpg-status.txt; then echo "::error::$v: a bad signature on SHA256SUMS"; exit 1; fi
            # A good signature (GOODSIG, not an expired or revoked key) followed by its VALIDSIG; count primary keys.
            awk '/^\[GNUPG:\] GOODSIG /{g=1; next} /^\[GNUPG:\] VALIDSIG /{if (g) print $NF; g=0; next} /^\[GNUPG:\] (EXPKEYSIG|REVKEYSIG|ERRSIG|NO_PUBKEY) /{g=0}' \
              gpg-status.txt | sort -u > signers.txt
            n=$(wc -l < signers.txt)
            echo "$v: good signatures from $n distinct builder keys"
            if [ "$n" -lt "$CORE_MIN_SIGNERS" ]; then echo "::error::$v: only $n good builder signatures, $CORE_MIN_SIGNERS needed"; exit 1; fi
            # 2. The signed file names the hash pinned above, and the tarball has it.
            line=$(grep -E "^[0-9a-f]{64}  $tarball\$" SHA256SUMS)
            [ "${line%% *}" = "$pinned" ] || { echo "::error::$v: SHA256SUMS does not hold the pinned hash"; exit 1; }
            echo "$pinned  $tarball" | sha256sum --check --strict
            tar xzf "$tarball"
            "bitcoin-$v/bin/bitcoind" -version | head -n 1
          done
      - name: Build gazpacho-test (CI's gcc-off build)
        uses: ./.github/actions/gz-build
        with:
          config: gcc-off
          targets: gazpacho-test
          save-cache: "false"
      - name: The helpers do what they claim (program_regtest_helpers, Core 29.0 and 29.1)
        run: |
          set -eu
          export GZ_BITCOIN_BIN_29_0="$RUNNER_TEMP/core/29.0/bitcoin-29.0/bin"
          export GZ_BITCOIN_BIN_29_1="$RUNNER_TEMP/core/29.1/bitcoin-29.1/bin"
          export GZ_REQUIRE_CORE="29.0 29.1"
          ctest --test-dir build -R '^program_regtest_helpers$' --output-on-failure --no-tests=error
      - name: The program tests on the look-alike (Core 29.1)
        run: |
          set -eu
          export GZ_BITCOIN_BIN="$RUNNER_TEMP/core/29.1/bitcoin-29.1/bin"
          ctest --test-dir build -R '^program_(slice1|sweep|host_funds|chain_throttle)$' --output-on-failure \
            --no-tests=error -j 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: regtest-helpers
          path: |
            build/program/regtest_helpers
            build/program/slice1
            build/program/sweep
            build/program/host_funds
            build/program/chain_throttle
          retention-days: 14
          if-no-files-found: warn
